[Unit]
After=multi-user.target

[Service]
# Wait until the boot job queue is empty so greetd starts after the bulk of
# the boot output has been written.
Type=idle
# Pin kernel messages to tty1 instead of whichever VT is in the foreground,
# so they never draw over the greeter on tty7. Pairs with console=tty1 on the
# kernel command line, which does the same for systemd's status output.
ExecStartPre=-/usr/bin/setlogcons 1
